# Coloque este arquivo em .github/workflows/cortes.yml
name: cortes-gta

on:
  schedule:
    - cron: "3-58/5 * * * *"   # de 5 em 5 minutos vê se tem live (evita o minuto 0, que atrasa mais)
  workflow_dispatch:
    inputs:
      teste:
        description: "Teste agora: posta 1 clipe como PRIVADO, mesmo sem live"
        type: boolean
        default: false

concurrency:
  group: cortes
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  cortes:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      STREAMERS: ${{ vars.STREAMERS }}
      TWITCH_CLIENT_ID: ${{ secrets.TWITCH_CLIENT_ID }}
      TWITCH_CLIENT_SECRET: ${{ secrets.TWITCH_CLIENT_SECRET }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
      YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
      YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Tem live agora?
        id: live
        run: |
          pip install -q requests
          python main.py checar

      - name: Instalar ffmpeg e fonte
        if: steps.live.outputs.aovivo == 'true' || inputs.teste
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg fonts-dejavu-core

      - name: Instalar bibliotecas
        if: steps.live.outputs.aovivo == 'true' || inputs.teste
        run: pip install -q -U yt-dlp pillow google-api-python-client google-auth

      - name: Pegar e postar os cortes
        if: steps.live.outputs.aovivo == 'true' || inputs.teste
        run: python main.py ${{ inputs.teste && 'teste' || 'live' }}
